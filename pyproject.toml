[build-system]
# >=77 for PEP 639 SPDX `license` string + `license-files` support.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name is drydock-cli (the established install name, continued
# from the retired v2 fork); the import package + CLI command stay `drydock`.
name = "drydock-cli"
version = "3.1.21"
description = "Drydock — a local, provider-agnostic terminal coding agent for local LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Frank Bobe III" }]
# Every package imported directly by drydock/ must be declared here — do NOT rely
# on transitive deps (httpx via openai, rich via textual): a clean/partial install
# then fails at runtime with ModuleNotFoundError (httpx bug, v3.1.15). pypdf is not
# transitive at all, so PDF extraction silently broke on fresh installs.
dependencies = [
    "openai>=1.0",
    "textual>=0.80",
    "httpx>=0.23",
    "rich>=13.0",
    "pypdf>=3.0",
]

[project.urls]
Homepage = "https://github.com/fbobe321/drydock"
Repository = "https://github.com/fbobe321/drydock"
Issues = "https://github.com/fbobe321/drydock/issues"

[tool.setuptools.packages.find]
include = ["drydock*"]

[tool.setuptools.package-data]
# Ship the bundled skill prompts (RMF, etc.) inside the wheel.
"drydock.builtin_skills" = ["*.md"]

[project.scripts]
drydock = "drydock.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "ruff", "pyright", "reportlab"]
# PDF ingestion fallback when the `pdftotext` binary (poppler) isn't installed.
# .docx needs nothing extra (stdlib zip/xml). `pip install drydock-cli[pdf]`.
pdf = ["pypdf>=4"]
# Semantic PDF redboxing (word bboxes + non-destructive annotations + render for
# vision-verify). All PERMISSIVE licences — pdfplumber (MIT), pypdf (BSD),
# pypdfium2 (Apache/BSD). Deliberately NOT PyMuPDF/fitz (AGPL). `[pdf-redbox]`.
pdf-redbox = ["pdfplumber>=0.11", "pypdf>=4", "pypdfium2>=4"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Pyflakes (F) + syntax-error checks (E9) catch the time-bombs that matter:
# undefined names, unused imports, redefinitions. Kept lean to avoid churn.
select = ["F", "E9"]

[tool.pyright]
include = ["drydock"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
# CI installs the package first, so third-party imports resolve.
reportMissingImports = true
