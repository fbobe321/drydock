[build-system]
# >=77 for PEP 639 SPDX `license` string + `license-files` support.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name is drydock-cli (the established install name, continued
# from the retired v2 fork); the import package + CLI command stay `drydock`.
name = "drydock-cli"
version = "3.0.106"
description = "Drydock — a local, provider-agnostic terminal coding agent for local LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Frank Bobe III" }]
dependencies = ["openai>=1.0", "textual>=0.80"]

[project.urls]
Homepage = "https://github.com/fbobe321/drydock"
Repository = "https://github.com/fbobe321/drydock"
Issues = "https://github.com/fbobe321/drydock/issues"

[tool.setuptools.packages.find]
include = ["drydock*"]

[tool.setuptools.package-data]
# Ship the bundled skill prompts (RMF, etc.) inside the wheel.
"drydock.builtin_skills" = ["*.md"]

[project.scripts]
drydock = "drydock.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "ruff", "pyright"]
# PDF ingestion fallback when the `pdftotext` binary (poppler) isn't installed.
# .docx needs nothing extra (stdlib zip/xml). `pip install drydock-cli[pdf]`.
pdf = ["pypdf>=4"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Pyflakes (F) + syntax-error checks (E9) catch the time-bombs that matter:
# undefined names, unused imports, redefinitions. Kept lean to avoid churn.
select = ["F", "E9"]

[tool.pyright]
include = ["drydock"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
# CI installs the package first, so third-party imports resolve.
reportMissingImports = true
